  - name: 简体中文
    link: /discordbot/zh-CN/
    lang: zh-CN
  - name: 繁體中文
    link: /discordbot/zh-TW/
    lang: zh-TW

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.blocks.admonition:
      types:
      - note
      - attention
      - caution
      - danger
      - error
      - tip
      - hint
      - warning
      # Custom types
      - info
      - check
  - pymdownx.blocks.tab:
      alternate_style: True
  - pymdownx.arithmatex:
      generic: true

