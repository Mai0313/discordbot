# One section per SQLite file under data/database, picked with `alembic -n <name>`. They share
# migrations/env.py, and each keeps its own revision history in migrations/versions/<name>.

[DEFAULT]
script_location = %(here)s/migrations
path_separator = os

[economy]
version_locations = %(here)s/migrations/versions/economy
sqlalchemy.url = sqlite:///data/database/economy.db

[games]
version_locations = %(here)s/migrations/versions/games
sqlalchemy.url = sqlite:///data/database/games.db

[reply]
version_locations = %(here)s/migrations/versions/reply
sqlalchemy.url = sqlite:///data/database/reply.db

[messages]
version_locations = %(here)s/migrations/versions/messages
sqlalchemy.url = sqlite:///data/database/messages.db
