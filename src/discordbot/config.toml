# Default bot configuration (git-tracked).
# Place deployment-specific overrides in ./data/config.toml; tables are deep-merged on top.

[global.bot]
# Playing-activity label shown in the bot's Discord presence.
activity = "Discord"

[global.logging]
# Lowest severity written to stdout and ./data/logs ("debug" keeps full traces; raise to "info" for outcomes only).
level = "debug"

[global.usage]
# Append-only monthly JSONL feature-usage records (separate from ./data/logs).
enabled = true
directory = "./data/usage"

[global.memory]
# Commit memory changes to ./data/memories/.git when an operator initialized a git repo there.
git_enabled = true

[global.media_hosting]
# External static host fallback for files exceeding Discord's per-message upload limit.
# Leave base_url or serve_dir empty to keep hosting disabled (the bot never creates serve_dir).
enabled = true
base_url = ""
serve_dir = ""
max_bytes = 8589934592
retention_hours = 168.0

[global.economy]
# Allow central-bank borrowers to approve their own loans (local testing only; keep false in production).
allow_central_bank_self_approval = false

[global.emojis]
# Standard Unicode defaults; override with custom `<:name:id>` Discord Application Emojis.
facebook = "📘"
instagram = "📷"
threads = "🧵"
twitter = "🐦"
douyin = "🎵"
bilibili = "📺"
done = "✅"
failed = "❌"
routing = "🔀"
image = "🖼️"
video = "🎬"
answer = "💬"
voice = "🗣️"
youtube = "▶️"
research = "🔬"

[global.reply]
# Operator-only AI reply switches (servers cannot override these).
# When false, attachments inline as base64 and linked-post media is skipped.
file_api_enabled = true
# When false, QA and media-persona replies post once finished without live preview edits.
streaming_enabled = true
# When false, finalized replies omit 👍/👎/🔄 buttons and skip reply.db turn snapshots.
feedback_enabled = true
# When true, QA turns sample from the blind-test candidate pool and mask the model label.
slow_model_blind_test_enabled = false

[server.auto_expand]
# Default per-server link auto-expansion (overridable per guild via `/settings`).
twitter = true
threads = true
facebook = true
instagram = true
douyin = true
