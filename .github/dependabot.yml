# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

# Ecosystems are staggered an hour apart: concurrent merges move each other's
# base, which blocks GITHUB_TOKEN from merging .github/workflows updates.

version: 2
updates:
  # pip (Python)
  # - package-ecosystem: "pip"
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
  #   commit-message:
  #     prefix: "chore"
  #     include: "scope"

  # uv (Python)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "Asia/Taipei"
    groups:
      uv:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # Devcontainers
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "daily"
      time: "05:00"
      timezone: "Asia/Taipei"
    groups:
      devcontainers:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Asia/Taipei"
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
      include: "scope"
