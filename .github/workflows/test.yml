name: Tests

# The diff decides whether the suite runs, never the branch name: a conventional-commits type says
# what a change is for and nothing about what it touched, so `chore/`, `ci/` and `docs/` branches
# have all carried Python here (#486). `**` first is what makes this fail safe, since a denylist
# covers a file type the repository grows later while an allowlist quietly stops running as the tree
# moves. `capabilities.md` is not prose: it is what `tests/test_capabilities.py` reads.
on:
  push:
    branches:
      - main
      - master
      - release/*
    paths:
      - "**"
      - "!**/*.md"
      - "src/discordbot/cogs/gen_reply/capabilities.md"
  pull_request:
    branches:
      - main
      - master
      - release/*
    paths:
      - "**"
      - "!**/*.md"
      - "src/discordbot/cogs/gen_reply/capabilities.md"

permissions: write-all

jobs:
  run_tests:
    name: Run Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        python-version:
          - "3.12"
          - "3.13"

    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          uv python pin ${{ matrix.python-version }}
          uv sync --group test

      - name: Check for tests
        id: check_tests
        run: |
          if [ -f tests/test_*.py ] || [ -d tests ]; then
              echo "Tests exist, proceeding to run them."
              echo "has_tests=true" >> $GITHUB_OUTPUT
          else
              echo "No tests to run."
              echo "has_tests=false" >> $GITHUB_OUTPUT
          fi

      - name: Run pytest
        if: ${{ steps.check_tests.outputs.has_tests == 'true' }}
        run: |
          set -o pipefail
          uv run pytest -vv | tee .coverage.txt

      - name: Pytest coverage comment
        if: ${{ steps.check_tests.outputs.has_tests == 'true' }}
        uses: MishaKav/pytest-coverage-comment@main
        with:
          pytest-coverage-path: ./.coverage.txt
          junitxml-path: ./.github/reports/.coverage.pytest.xml
          pytest-xml-coverage-path: ./.github/reports/coverage.xml
          unique-id-for-comment: ${{ matrix.python-version }}-${{ matrix.os }}
          title: Coverage for Python ${{ matrix.python-version }} on ${{ matrix.os }}
          hide-emoji: true
