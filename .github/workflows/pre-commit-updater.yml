name: Pre-commit auto-update

on:
  # every day at midnight
  schedule:
    - cron: "0 0 * * *"
  # manually trigger a workflow_dispatch event
  workflow_dispatch:

permissions: write-all

jobs:
  auto-update:
    name: Auto Update Pre-Commit Hooks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Pre-Commit
        run: |
          # ty is held back to the reviewed PR below, so a ty release that changes
          # its diagnostics cannot block every other hook from updating here.
          # `local` and `meta` are not updatable repos, and autoupdate rejects the
          # whole list if one entry does not name a real repo.
          mapfile -t repos < <(sed -n 's/^[[:space:]]*-[[:space:]]*repo:[[:space:]]*"\?\([^ "#]*\).*/\1/p' .pre-commit-config.yaml | grep -Ev 'ty-pre-commit|^(local|meta)$')
          uvx pre-commit autoupdate -j 8 "${repos[@]/#/--repo=}"
          uvx pre-commit run -a

      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@v8.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/pre-commit-hooks  # push from this branch
          title: "chore: Update pre-commit hooks"
          body: "Update versions of pre-commit hooks to latest version."
          commit-message: "chore: update pre-commit hooks"
          delete-branch: true

      - name: Auto Merge Pull Request
        continue-on-error: true
        if: ${{ steps.create-pr.outputs.pull-request-url }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge --squash --delete-branch "${{ steps.create-pr.outputs.pull-request-url }}"

      # ty is the only type-check gate and its releases do not promise stable
      # diagnostics, so its bump gets its own PR that a human merges. The new
      # version is exercised here rather than on the PR: a PR opened with
      # GITHUB_TOKEN starts no workflow runs, so it would arrive with no checks.
      - name: Update ty
        id: update-ty
        run: |
          git reset --hard HEAD
          uvx pre-commit autoupdate --repo https://github.com/astral-sh/ty-pre-commit
          # Only the ty hook: the others are unchanged here, and a formatter would
          # otherwise fold its rewrites into this PR.
          if uvx pre-commit run ty -a; then
            echo "result=passed" >> "$GITHUB_OUTPUT"
          else
            echo "result=FAILED" >> "$GITHUB_OUTPUT"
          fi

      - name: Create ty Pull Request
        uses: peter-evans/create-pull-request@v8.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/ty-hook  # push from this branch
          title: "chore: Update ty pre-commit hook"
          body: |
            Update the ty hook to its latest version.

            `pre-commit run ty -a` against the new version: **${{ steps.update-ty.outputs.result }}**.

            This PR is opened with `GITHUB_TOKEN`, so it runs no checks of its own.
            The line above is the gate; read it before merging.
          commit-message: "chore: update ty pre-commit hook"
          delete-branch: true
