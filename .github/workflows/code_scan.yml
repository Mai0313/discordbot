name: Code Scanning

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions: write-all

jobs:
  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: GitLeaks Scanning
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trufflehog Scanning
        uses: trufflesecurity/trufflehog@v3.96.0
        with:
          # The Lob detector matches `(live|test)_` plus 35 word characters, so
          # any test named as a full sentence can hit it, and its verifier POSTs
          # a bodyless request that Lob answers 422 before it looks at the key,
          # so every match reports as verified. It cannot tell a real Lob key
          # from a test name, and this repo has no Lob integration. See #472.
          extra_args: --results=verified,unknown --exclude-detectors=lob

  codeql-scanning:
    name: CodeQL Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: CodeQL Initialize
        uses: github/codeql-action/init@v4.37.5

      - name: CodeQL Analyze
        uses: github/codeql-action/analyze@v4.37.5
